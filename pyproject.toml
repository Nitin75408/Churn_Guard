[project]
name = "churn-guard"
version = "0.1.0"
description = "Customer churn prediction with cost-based decisioning, served over an API"
readme = "README.md"
authors = [
    { name = "Nitin Madaan", email = "nitinmad73@gmail.com" }
]
requires-python = ">=3.12"

# Runtime only — everything the API and dashboard need to serve predictions.
# The Docker image installs exactly this set (`uv sync --no-dev`), which keeps it
# smaller, faster to build, and smaller as a security surface. Training-only and
# analysis-only tools live in the dev group below.
#
# pandas is capped below 3 because mlflow requires pandas<3, and numpy below 2.4
# because numba (a shap dependency) has not caught up. Pinning the stack for
# mutual compatibility beats chasing the newest release of any single package.
dependencies = [
    "fastapi>=0.141.1",
    "joblib>=1.5.3",
    "matplotlib>=3.11.1",
    "numpy>=1.26,<2.4",
    "pandas>=2.2,<3",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
    "streamlit>=1.61.1",
    "uvicorn>=0.52.1",
]

[dependency-groups]
# Training, experiment tracking and exploratory analysis. Installed locally by
# default (`uv sync`), excluded from the serving image (`uv sync --no-dev`).
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "mlflow>=3.0",
    "psycopg[binary]>=3.3.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
churn-guard = "churn_guard:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Fail on unexpected warnings from our own code, so a deprecation is dealt with
# when it appears rather than discovered when it becomes an error. Third-party
# warnings we cannot fix are listed explicitly rather than blanket-ignored.
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::PendingDeprecationWarning:shap.*",
    "ignore::UserWarning:sklearn.preprocessing._encoders",
]

[tool.ruff]
line-length = 92
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes — undefined names, unused imports
    "I",    # isort — import ordering
    "UP",   # pyupgrade — modern syntax
    "B",    # bugbear — likely bugs
    "SIM",  # simplifiable code
]
# E501 is handled by the formatter; private-member access is deliberate in the
# few places tests reach into scikit-learn internals to verify fitted state.
ignore = ["E501", "SLF001"]

[tool.ruff.lint.per-file-ignores]
# E402 (import not at top of file). This file must run two statements before
# its imports: matplotlib.use("Agg") has to precede pyplot, and src/ has to
# join sys.path before churn_guard is importable on hosts that install from
# requirements.txt without installing the project. Both are deliberate.
"streamlit_app.py" = ["E402"]
