name: CI

# Runs on every push and pull request to main. The point is not ceremony: these
# are the checks that would have caught the real bugs in this project's history
# — a column-order mismatch that silently renamed features, an estimator whose
# MRO made cross-validation return nan, and a batch endpoint whose response
# could not be joined back to its request.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you trigger a run by hand from the Actions tab.
  workflow_dispatch:

# A newer push cancels an in-progress run for the same branch. Without this,
# pushing three times queues three full pipelines and you wait for all of them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never let a warning-driven interactive prompt hang a runner.
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Lint, train and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"
          # Caches the resolved dependency set, keyed on uv.lock. A run whose
          # lockfile is unchanged reuses it instead of redownloading ~180
          # packages.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        # --frozen fails if uv.lock disagrees with pyproject.toml, so CI cannot
        # quietly resolve a different dependency set than the one committed.
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests streamlit_app.py

      # The pipeline runs from scratch on a clean checkout. This is the real
      # reproducibility test: data/ and models/ are gitignored, so if any step
      # depends on a file that only exists on a developer's laptop, it fails
      # here rather than for whoever clones the repo next.
      - name: Ingest data
        run: uv run python -m churn_guard.data.ingest

      - name: Split data
        run: uv run python -m churn_guard.data.split

      - name: Train and select a model
        run: uv run python -m churn_guard.models.train

      - name: Evaluate on the sealed test set
        run: uv run python -m churn_guard.models.evaluate

      - name: Run tests
        run: uv run pytest --cov=churn_guard --cov-report=term-missing

      # Handed to the docker job rather than retraining there. Building the same
      # artifact twice invites the two copies to differ.
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            models/
            reports/final_evaluation.json
            data/interim/test.csv
            data/interim/split_manifest.json
          retention-days: 7

  docker:
    name: Build image and smoke test
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Download model artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: churn-guard:ci
          # Persist the layer cache between runs, so an unchanged dependency
          # layer is reused instead of reinstalled.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building an image proves it compiles, not that it runs. These checks
      # prove the container actually serves predictions — the failure mode where
      # an image builds fine and then crashes on startup is common and would
      # otherwise reach production.
      - name: Start the container
        run: |
          docker run -d --name churnguard -p 8000:8000 churn-guard:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
              echo "healthy after ${attempt}0s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::container never became healthy"
          docker logs churnguard
          exit 1

      - name: Check the model actually loaded
        run: |
          body=$(curl -fsS http://localhost:8000/health)
          echo "$body"
          echo "$body" | grep -q '"model_loaded":true' \
            || { echo "::error::model did not load"; docker logs churnguard; exit 1; }

      - name: Smoke test a prediction
        run: |
          response=$(curl -fsS -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"gender":"Female","SeniorCitizen":0,"Partner":"No","Dependents":"No",
                 "tenure":2,"PhoneService":"Yes","MultipleLines":"No",
                 "InternetService":"Fiber optic","OnlineSecurity":"No","OnlineBackup":"No",
                 "DeviceProtection":"No","TechSupport":"No","StreamingTV":"No",
                 "StreamingMovies":"No","Contract":"Month-to-month","PaperlessBilling":"Yes",
                 "PaymentMethod":"Electronic check","MonthlyCharges":70.7,"TotalCharges":151.65}')
          echo "$response"
          echo "$response" | grep -q '"churn_probability"' \
            || { echo "::error::prediction response malformed"; exit 1; }

      - name: Check validation rejects bad input
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' -d '{"gender":"Female","tenure":"two"}')
          [ "$code" = "422" ] \
            || { echo "::error::expected 422 for invalid payload, got $code"; exit 1; }
          echo "invalid payload correctly rejected with 422"

      - name: Container logs
        if: always()
        run: docker logs churnguard || true

      - name: Stop the container
        if: always()
        run: docker rm -f churnguard || true
