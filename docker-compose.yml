# ChurnGuard — API and dashboard, started together.
#
#   docker compose up --build
#
#   API   http://localhost:8000/docs
#   UI    http://localhost:8501
#
# Both services run the same image with different commands. One build, one
# artifact, two roles — so the dashboard can never be running against a
# different version of the code than the API it calls.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: churn-guard:latest
    container_name: churnguard-api
    # Explicit, because the image's default command starts both services for
    # single-port hosts. Here they get a container each.
    command: ["uvicorn", "churn_guard.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      # Repeated from the Dockerfile so compose can gate the dashboard on it.
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 3
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: churn-guard:latest
    container_name: churnguard-ui
    depends_on:
      api:
        # Waits for the API to report healthy, not merely to have started. A bare
        # depends_on only waits for the container to exist, which would let the
        # dashboard start first and silently fall back to in-process scoring —
        # working, but not demonstrating the architecture.
        condition: service_healthy
    environment:
      # Compose provides DNS on the shared network, so the API is reachable by
      # service name. This is why the address had to be configurable rather than
      # hardcoded to localhost.
      CHURNGUARD_API_URL: http://api:8000
    command:
      - streamlit
      - run
      - streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      # Streamlit collects usage stats by default; off by choice.
      - --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Analytics warehouse.
  #
  # Deliberately NOT a dependency of the API. Serving loads a self-contained
  # model artifact and must keep working if the warehouse is down — an
  # analytics database outage should never take predictions offline.
  #
  # This is where the SQL layer lives: raw storage, cleaning views, and the
  # analytics marts that BI tools read.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: churnguard-db
    environment:
      POSTGRES_USER: churnguard
      POSTGRES_PASSWORD: churnguard
      POSTGRES_DB: churnguard
    ports:
      # Exposed on the host so Power BI, DBeaver or psql can connect directly.
      - "5432:5432"
    volumes:
      # Named volume, so the data survives `docker compose down`. Without it,
      # every restart would mean reloading the warehouse from scratch.
      - churnguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churnguard -d churnguard"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  churnguard_pgdata:
